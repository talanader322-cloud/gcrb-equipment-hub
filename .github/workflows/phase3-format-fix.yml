name: Phase 3 Format Fix

on:
  push:
    branches:
      - phase3-catalog-viewer-downloads-offline
    paths:
      - .github/workflows/phase3-format-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-catalog-viewer-downloads-offline
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fix hook order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated/catalogs.$catalogId.tsx')
          text = path.read_text()
          text = text.replace('import { useEffect, useMemo, useRef, useState } from "react";', 'import { useEffect, useRef, useState } from "react";')
          old = '''  const viewerBaseUrl = offlineUrl ?? cloudUrl;\n  const viewerUrl = useMemo(() => {\n    if (!viewerBaseUrl) return null;\n    return selectedSection?.page_from ? `${viewerBaseUrl}#page=${selectedSection.page_from}` : viewerBaseUrl;\n  }, [selectedSection?.page_from, viewerBaseUrl]);'''
          new = '''  const viewerBaseUrl = offlineUrl ?? cloudUrl;\n  const viewerUrl = !viewerBaseUrl\n    ? null\n    : selectedSection?.page_from\n      ? `${viewerBaseUrl}#page=${selectedSection.page_from}`\n      : viewerBaseUrl;'''
          if old not in text:
              raise SystemExit('Expected useMemo viewer block was not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Format Phase 3 files
        run: |
          bunx prettier --write \
            'src/services/offline/offlineCatalogService.ts' \
            'src/services/offline/catalogDownloadManager.ts' \
            'src/services/repositories/personalRepository.ts' \
            'src/routes/_authenticated/catalogs.$catalogId.tsx' \
            'src/routes/_authenticated/downloads.tsx' \
            'src/routes/_authenticated/assemblies.$assemblyId.tsx' \
            'docs/PHASE3_OFFLINE_ARCHITECTURE.md'
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/offline src/services/repositories/personalRepository.ts 'src/routes/_authenticated/catalogs.$catalogId.tsx' 'src/routes/_authenticated/downloads.tsx' 'src/routes/_authenticated/assemblies.$assemblyId.tsx' docs/PHASE3_OFFLINE_ARCHITECTURE.md
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
          else
            git commit -m 'Fix Phase 3 hook order and formatting'
            git push origin HEAD:phase3-catalog-viewer-downloads-offline
          fi
